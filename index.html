<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14102a; --panel:#1f1a3d; --panel2:#2a2452; --line:#3a3370; --field:#120e26;
  --text:#f3f0ff; --muted:#a9a3d1;
  --accent:#ff4fa3; --accent2:#5ee7ff; --good:#3ddc97; --bad:#ff6b6b; --warn:#ffcc4d;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;
  background:radial-gradient(1100px 600px at 5% -10%,#3b1f6b 0,transparent 60%),
             radial-gradient(900px 500px at 110% 0%,#0f3d5c 0,transparent 55%),var(--bg);background-attachment:fixed}
h1,h2,h3,.display{font-family:Fredoka,Inter,sans-serif;font-weight:600;margin:0}
h2{font-size:20px;margin-bottom:12px}
a{color:var(--accent2)}
code{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}
[hidden]{display:none!important}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 24px;border-bottom:1px solid var(--line);background:rgba(20,16,42,.88);backdrop-filter:blur(8px)}
.logo{font:700 22px Fredoka,sans-serif;letter-spacing:.01em}
.logo span{color:var(--accent)}
nav{display:flex;gap:6px}
.tab{appearance:none;border:1px solid transparent;background:none;color:var(--muted);font:600 15px Inter,sans-serif;padding:8px 14px;border-radius:10px;cursor:pointer}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);background:var(--panel2);border-color:var(--line)}

main{max-width:1220px;margin:0 auto;padding:24px 16px 80px}
.stack{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 16px;
  font:600 15px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .05s,filter .15s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#06261a}
.btn.ghost{background:none}
.btn.big{padding:14px 22px;font-size:17px;border-radius:14px}
.btn.huge{padding:18px 26px;font:700 22px Fredoka,sans-serif;border-radius:16px;width:100%;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}

input,textarea,select{background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent2);outline-offset:1px}
textarea{width:100%;min-height:340px;resize:vertical;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;appearance:none;border:0;background:none;color:var(--muted);padding:7px 10px;border-radius:8px;font:600 14px Inter,sans-serif;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}

.rtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rtab{appearance:none;border:1px solid var(--line);background:var(--field);color:var(--muted);border-radius:999px;padding:7px 14px;font:600 14px Inter,sans-serif;cursor:pointer}
.rtab.on{background:var(--panel2);color:var(--text);border-color:var(--accent)}
.pill{display:inline-block;min-width:22px;padding:0 7px;border-radius:999px;background:var(--panel2);font-size:12px;text-align:center;margin-left:4px}
.notes{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.note{padding:8px 12px;border-radius:10px;font-size:14px;border:1px solid var(--line);background:var(--field)}
.note.ok{border-color:rgba(61,220,151,.5)}
.note.warn{border-color:rgba(255,204,77,.6)}
.note.bad{border-color:rgba(255,107,107,.7)}
.testlist{max-height:240px;overflow:auto;font-size:13px;margin-top:8px}
.testlist div{padding:3px 0;border-bottom:1px solid var(--line)}

/* Play view */
.playhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.playhead h1{font-size:28px}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stage{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel)}
.stage .n{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stage .t{font:600 18px Fredoka,sans-serif}
.stage .w{font-size:12px;color:var(--good);margin-top:2px;word-break:break-word}
.stage.now{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,79,163,.22);background:linear-gradient(180deg,rgba(255,79,163,.12),transparent)}
.stage.done .t{text-decoration:line-through;text-decoration-color:var(--good)}
.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
.nowcard{position:relative}
.nowlabel{font-size:12px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em}
.nowtitle{font:600 34px/1.1 Fredoka,sans-serif;margin-top:6px}
.nowartist{font-size:18px;color:var(--muted);margin-top:2px}
.hidetitles .nowtitle,.hidetitles .nowartist,.hidetitles .upnext .t,.hidetitles .playedlist,.hidetitles .ticklist{filter:blur(9px);user-select:none}
.ytbox{margin-top:14px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ytbox iframe,#yt{width:320px;height:180px;border-radius:12px;background:#000;max-width:100%}
.bar{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden;margin-top:14px}
.bingo-splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-family:Fredoka,Inter,sans-serif;font-weight:700;font-size:clamp(64px,16vw,220px);color:#fff;letter-spacing:.02em;
  text-shadow:0 0 30px var(--accent),0 0 60px var(--accent),0 6px 0 rgba(0,0,0,.35);background:radial-gradient(circle,rgba(255,79,163,.28),transparent 65%);
  animation:bingoPop 1.6s ease-out forwards}
@keyframes bingoPop{0%{opacity:0;transform:scale(.4) rotate(-6deg)}15%{opacity:1;transform:scale(1.12) rotate(2deg)}
  30%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.bingo-splash{animation:bingoFade 1.6s linear forwards}@keyframes bingoFade{0%,80%{opacity:1}100%{opacity:0}}}
@media print{.bingo-splash{display:none!important}}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s linear}
.upnext{margin-top:14px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px}
.upnext .t{font:600 20px Fredoka,sans-serif}
.playedlist{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow:auto;font-size:14px}
.playedlist div{display:flex;gap:10px;padding:5px 2px;border-bottom:1px solid var(--line)}
.playedlist b{color:var(--muted);min-width:26px;font-weight:600}
.ticklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;max-height:340px;overflow:auto;margin-top:10px}
.ticklist label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1px solid var(--line);border-radius:10px;font-size:13px;cursor:pointer;background:var(--field)}
.ticklist label.on{border-color:var(--good);background:rgba(61,220,151,.12)}
.banner{border-radius:16px;padding:16px 18px;border:1px solid var(--good);background:rgba(61,220,151,.12)}
.banner h3{font-size:22px;margin-bottom:4px}

.codein{font:700 30px/1 Fredoka,sans-serif;letter-spacing:.14em;text-transform:uppercase;width:100%;text-align:center;padding:14px}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}
.cell{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:6px 4px;font-size:11.5px;line-height:1.25;min-height:58px;
  display:flex;flex-direction:column;justify-content:center;text-align:center;word-break:break-word}
.cell small{color:var(--muted);font-size:10.5px;margin-top:2px}
.cell.hit{background:rgba(61,220,151,.2);border-color:var(--good)}
.cell.rowfull{box-shadow:inset 0 0 0 2px var(--good)}
.cell.last{outline:2px solid var(--warn);outline-offset:-1px}
.verdict{font:600 24px/1.2 Fredoka,sans-serif;margin-top:14px}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--bad)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:12px;max-width:min(560px,92vw);
  box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:var(--bad)}

/* On-screen card preview (cards tab) */
.preview{background:#fff;color:#111;border-radius:14px;padding:18px;max-width:780px;overflow-x:auto}
.preview .sheet{height:auto;min-width:560px}
.preview .rcard{min-height:150px}

/* Print sheets: one A4 page per player, a card for each round */
#yttest{position:fixed;left:-10000px;top:0;width:200px;height:200px}
#print-area{display:none}
/* 236mm tall leaves room for Safari's own margins and header/footer on A4 or Letter. */
.sheet{height:236mm;overflow:hidden;break-inside:avoid;page-break-inside:avoid;display:flex;flex-direction:column;gap:3.5mm;font-family:Inter,sans-serif;color:#111;background:#fff;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.phead{display:flex;justify-content:space-between;align-items:center;gap:4mm;border-bottom:2.5px solid #111;padding-bottom:2.5mm}
.pev{font:700 18pt Fredoka,sans-serif;line-height:1.1}
.pround{font:500 9pt Inter,sans-serif;color:#444;margin-top:1mm}
.pcodebox{text-align:center}
.pcodebox small{display:block;font:600 7.5pt Inter,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:#444}
.pcode{font:700 22pt Fredoka,sans-serif;letter-spacing:.12em;border:2.5px solid #111;border-radius:3mm;padding:0 4mm;white-space:nowrap}
.rcard{flex:1;display:flex;gap:2.5mm;min-height:0}
.rlabel{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center;
  background:#111;color:#fff;border-radius:2mm;padding:0 1.5mm;font:700 12pt Fredoka,sans-serif;letter-spacing:.06em}
.pgrid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);border:2px solid #111}
.pcell{border:1px solid #111;padding:1mm 1.2mm;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  font:600 8.5pt/1.15 Inter,sans-serif;word-break:break-word;overflow:hidden}
.pcell small{font-weight:400;font-size:7pt;color:#444;margin-top:.6mm}
.pfoot{font:8pt Inter,sans-serif;color:#333;display:flex;justify-content:space-between;gap:4mm}
@media print{
  @page{size:A4 portrait;margin:10mm}
  html{color-scheme:light;background:#fff!important}
  body{background:#fff!important;color:#111}
  header,main,.toast{display:none!important}
  #print-area{display:block}
  .sheet{break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
}

@media (max-width:900px){.cols{grid-template-columns:1fr}}
@media (max-width:640px){
  header{padding:10px 16px}
  .stages{grid-template-columns:repeat(2,1fr)}
  .nowtitle{font-size:26px}
  .cell{font-size:10px;min-height:50px}
}
</style>
</head>
<body>
<header>
  <div class="logo">🎵 Music <span>Bingo</span></div>
  <nav>
    <button class="tab" data-view="setup">1 · Setup</button>
    <button class="tab" data-view="cards">2 · Print cards</button>
    <button class="tab" data-view="play">3 · Play</button>
  </nav>
</header>

<main>
  <section id="view-setup" class="stack"></section>
  <section id="view-cards" class="stack" hidden></section>
  <section id="view-play" class="stack" hidden>
    <div id="play-file-warning"></div>
    <div id="play-head"></div>
    <div id="play-stages" class="stages"></div>
    <div id="play-banner"></div>
    <div class="cols">
      <div class="stack">
        <div class="panel nowcard" id="now-panel">
          <div id="now-info"></div>
          <div class="ytbox" id="yt-wrap"><div id="yt"></div><div id="yt-side" class="muted small" style="flex:1;min-width:180px"></div></div>
          <div id="clip-wrap"><div class="bar"><i id="clipbar"></i></div><div class="row small muted" style="margin-top:6px"><span id="cliptime"></span></div></div>
          <div id="controls" class="row" style="margin-top:14px"></div>
          <div id="upnext"></div>
        </div>
        <div class="panel" id="tick-panel"></div>
        <div class="panel"><div class="row"><h2 style="margin:0">Songs played</h2><span class="spacer"></span><button class="btn ghost small" id="undo-btn">↩ Undo last</button></div><div id="played" class="playedlist" style="margin-top:10px"></div></div>
      </div>
      <div class="stack">
        <button class="btn primary huge" id="bingo-btn">🎤 BINGO called!</button>
        <div class="panel">
          <h2>Check a card</h2>
          <p class="muted small" style="margin:0 0 10px">Type the code printed on the player's sheet.</p>
          <form id="check-form" class="stack" style="gap:10px">
            <input id="check-input" class="codein" placeholder="K7QXM" autocomplete="off" spellcheck="false">
            <button class="btn big primary" style="justify-content:center">Check card</button>
          </form>
          <div id="check-result"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="yttest"><div id="yttest-inner"></div></div>
<div id="print-area"></div>
<div id="toast" class="toast" role="status"></div>

<script>
// ---------- Constants & helpers ----------
const STAGES = [
  {name:'5 songs',    desc:'Any 5 songs anywhere on the card'},
  {name:'1 line',     desc:'One full horizontal line'},
  {name:'2 lines',    desc:'Two full horizontal lines'},
  {name:'Full house', desc:'All 15 songs'}
];
// Codes skip look-alike characters (0/O, 1/I/L) so they are easy to read out and type.
const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const STORE = 'musicBingo.v1';

const EXAMPLE = `# Example list - swap these for your own songs. One per line:
# Song title - Artist | YouTube link | optional start time (e.g. 1:05, or mid for halfway)
Never Gonna Give You Up - Rick Astley | https://www.youtube.com/watch?v=dQw4w9WgXcQ
Bohemian Rhapsody - Queen | https://www.youtube.com/watch?v=fJ9rUzIMcZQ | 0:40
Mr. Brightside - The Killers | https://www.youtube.com/watch?v=gGdGFtwCNBE
Dancing Queen - ABBA | https://www.youtube.com/watch?v=xFrGuyw1V8s
Africa - Toto | https://www.youtube.com/watch?v=FTQbiNvZqaY
Take On Me - a-ha | https://www.youtube.com/watch?v=djV11Xbc914
Don't Stop Believin' - Journey | https://www.youtube.com/watch?v=1k8craCGpgs
Livin' on a Prayer - Bon Jovi | https://www.youtube.com/watch?v=lDK9QqIzhwk
I Wanna Dance with Somebody - Whitney Houston | https://www.youtube.com/watch?v=eH3giaIzONA
Wannabe - Spice Girls | https://www.youtube.com/watch?v=gJLIiF15wjQ
Everybody (Backstreet's Back) - Backstreet Boys | https://www.youtube.com/watch?v=6M6samPEMpM
Mamma Mia - ABBA | https://www.youtube.com/watch?v=unfzfe8f9NI
Eye of the Tiger - Survivor | https://www.youtube.com/watch?v=btPJPFnesV4
September - Earth, Wind & Fire | https://www.youtube.com/watch?v=Gs069dndIYk
Billie Jean - Michael Jackson | https://www.youtube.com/watch?v=Zi_XLOBDo_Y
Happy - Pharrell Williams | https://www.youtube.com/watch?v=ZbZSe6N_BXs
Uptown Funk - Mark Ronson ft. Bruno Mars | https://www.youtube.com/watch?v=OPf0YbXqDm0
Wake Me Up Before You Go-Go - Wham! | https://www.youtube.com/watch?v=pIgZ7gMze7A
Shape of You - Ed Sheeran | https://www.youtube.com/watch?v=JGwWNGJdvx8
Rolling in the Deep - Adele | https://www.youtube.com/watch?v=rYEDA3JcQqw
Levitating - Dua Lipa | https://www.youtube.com/watch?v=TUVcZfQe-Kw
Wake Me Up - Avicii | https://www.youtube.com/watch?v=IcrbM1l_BoI
YMCA - Village People | https://www.youtube.com/watch?v=CS9OO0S5w2k
Beat It - Michael Jackson | https://www.youtube.com/watch?v=oRdxUFDoQe0
`;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, kind = '') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + kind;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.className = 'toast', 4000);
}

function hashStr(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 2654435761);
    h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  return h1 >>> 0;
}
function mulberry32(a) {
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- State ----------
function freshRoundProgress() {
  return {played: [], skipped: [], current: null, next: null, stage: 0, winners: [], pending: false, done: false};
}
function defaultGame() {
  return {
    v: 1, name: 'Music Bingo', mode: 'youtube', clip: 30, cardsPerRound: 30, codes: [],
    rounds: [0, 1, 2, 3].map(() => ({text: '', printedHash: null})),
    prog: {round: 0, finished: false, rounds: [0, 1, 2, 3].map(freshRoundProgress)}
  };
}
function load() {
  try {
    const g = JSON.parse(localStorage.getItem(STORE));
    if (g && g.v === 1) { if (!Array.isArray(g.codes)) g.codes = []; return g; }
  } catch (e) {}
  return defaultGame();
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(game)); } catch (e) {}
}
let game = load();

// ---------- Song list parsing ----------
function parseTime(t) {
  t = String(t).trim().toLowerCase();
  if (/^\d+$/.test(t)) return +t;
  if (/^\d+:\d{1,2}$/.test(t)) { const [m, s] = t.split(':'); return +m * 60 + +s; }
  const m = t.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
  return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0;
}
function parseYT(url) {
  try {
    const u = new URL(/^https?:\/\//i.test(url) ? url : 'https://' + url);
    const host = u.hostname.replace(/^(www|m|music)\./, '');
    let id = null;
    if (host === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
    else if (host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')) {
      id = u.searchParams.get('v');
      if (!id) { const m = u.pathname.match(/\/(embed|shorts|live|v)\/([\w-]{11})/); if (m) id = m[2]; }
    }
    if (!id || !/^[\w-]{11}$/.test(id)) return null;
    const t = u.searchParams.get('t') || u.searchParams.get('start');
    return {id, start: t ? parseTime(t) : 0};
  } catch (e) { return null; }
}
const parseCache = new Map();
function parseSongs(text) {
  if (parseCache.has(text)) return parseCache.get(text);
  const songs = [], errors = [];
  text.split('\n').forEach((raw, i) => {
    const line = raw.trim();
    if (!line || line.startsWith('#')) return;
    const parts = line.split('|').map(s => s.trim());
    let label = parts[0], url = parts[1] || '';
    const startText = parts[2] || '';
    if (!url) {
      const m = label.match(/(https?:\/\/\S+)/);
      if (m) { url = m[1]; label = label.replace(m[1], '').replace(/[\s\-–—,]+$/, '').trim(); }
    }
    let title = label, artist = '';
    const dm = label.match(/^(.*?)\s+[-–—]\s+(.*)$/);
    if (dm) { title = dm[1].trim(); artist = dm[2].trim(); }
    const yt = url ? parseYT(url) : null;
    if (url && !yt) errors.push(`Line ${i + 1}: couldn't read the YouTube link`);
    songs.push({title, artist, label, id: yt ? yt.id : null, start: /^(mid|middle)$/i.test(startText) ? 'mid' : startText ? parseTime(startText) : (yt ? yt.start : 0), line: i + 1});

const songsOf = r => parseSongs(game.rounds[r].text).songs;
// Fingerprint of the song names only, so fixing a link after printing doesn't invalidate cards.
function listHash(r) {
  let h = hashStr(songsOf(r).map(s => s.label).join('\n')), out = '';
  for (let i = 0; i < 3; i++) { out += ALPH[h % ALPH.length]; h = Math.floor(h / ALPH.length); }
  return out;
}

// ---------- Player codes ----------
// One code per player sheet: 4 random chars + 1 check char, e.g. "K7QXM".
// Each round's card is derived from the code + round number, so nothing needs storing to check a claim.
function checkChar(body) {
  let s = 0;
  for (let i = 0; i < body.length; i++) s += (i + 2) * (ALPH.indexOf(body[i]) + 1);
  return ALPH[s % ALPH.length];
}
function newCode() {
  let b = '';
  for (let i = 0; i < 4; i++) b += ALPH[Math.floor(Math.random() * ALPH.length)];
  return b + checkChar(b);
}
function parseCode(raw) {
  const c = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length !== 5) return {error: 'Codes are 5 characters, like K7QXM.'};
  if ([...c].some(ch => !ALPH.includes(ch)) || checkChar(c.slice(0, 4)) !== c[4])
    return {error: 'That code isn\'t valid. Check it was typed correctly (codes never use O, I, L, 0 or 1).'};
  return {code: c};
}
function cardFor(code, n, r) {
  const rng = mulberry32(hashStr(code + '#' + (r + 1)));
  const idx = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx.slice(0, 15);
}
function ensureCodes() {
  while (game.codes.length < game.cardsPerRound) {

  }
}

function roundNotes(r) {
  const {songs, errors} = parseSongs(game.rounds[r].text);
  const notes = [];
  if (!songs.length) return [{k: 'warn', t: 'No songs yet.'}];
  if (songs.length < 15) notes.push({k: 'bad', t: `${songs.length} songs. You need at least 15 (one card holds 15).`});
  else if (songs.length < 25) notes.push({k: 'warn', t: `${songs.length} songs. This works, but with so few songs, lots of cards will win at the same time. 30+ is better.`});
  else notes.push({k: 'ok', t: `✓ ${songs.length} songs, good to go.`});
  if (game.mode === 'youtube') {
    const missing = songs.filter(s => !s.id).length;
    if (missing) notes.push({k: 'warn', t: `${missing} song${missing > 1 ? 's have' : ' has'} no YouTube link and won't be played in YouTube mode.`});
  }
  errors.forEach(e => notes.push({k: 'bad', t: e}));
  const R = game.rounds[r];
  if (R.printedHash && R.printedHash !== listHash(r))
    notes.push({k: 'bad', t: '⚠ The song names or order changed after you printed cards for this round. Printed cards won\'t match any more. Undo the change or reprint. (Changing only the links is fine.)'});
  return notes;
}

function exportGame() {

function importGame(e) {

  const fr = new FileReader();
  fr.onload = () => {
    try {
      const g = JSON.parse(fr.result);
      if (!g || g.v !== 1 || !Array.isArray(g.rounds)) throw new Error();
      if (!Array.isArray(g.codes)) g.codes = [];
      stopYT(); game = g; lastCheck = null; save(); renderSetup(); toast('Backup loaded.');

const curR = () => P().rounds[P().round];

function pickNext(R, n, exclude = []) {

  const pool = [];

function switchRound(r) {

// Real recording: put a file called bingo.mp3 next to index.html. It's downloaded and decoded when the
// page opens so it plays instantly. If the file is missing, the browser's voice is used instead.
const AC = window.AudioContext || window.webkitAudioContext;
const bingoCtx = AC ? new AC() : null;
let bingoBuf = null, bingoState = 'loading';  // loading | ready | missing
fetch('bingo.mp3')
  .then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
  .then(b => new Promise((ok, bad) => bingoCtx.decodeAudioData(b, ok, bad)))
  .then(buf => { bingoBuf = buf; bingoState = 'ready'; })
  .catch(() => { bingoState = 'missing'; });

document.addEventListener('pointerdown', () => { if (bingoCtx && bingoCtx.state === 'suspended') bingoCtx.resume(); }, {once: true, capture: true});

  if (bingoState === 'ready') {
    try {
      if (bingoCtx.state === 'suspended') bingoCtx.resume();
      const src = bingoCtx.createBufferSource();
      src.buffer = bingoBuf; src.connect(bingoCtx.destination); src.start(0);
    } catch (e) {}
  } else if (bingoState === 'loading') {
    try { new Audio('bingo.mp3').play().catch(() => {}); } catch (e) {}
  } else try {
    // No recording found: say it out loud with the browser's built-in voice
    const synth = window.speechSynthesis;
    if (synth) {
      synth.cancel();
      const u = new SpeechSynthesisUtterance('Bingooooo!');
      u.lang = 'en-GB'; u.rate = 0.8; u.pitch = 1.3; u.volume = 1;
      const v = synth.getVoices().find(v => /^en[-_]/i.test(v.lang));
      if (v) u.voice = v;
      synth.speak(u);
    }
  } catch (e) {}
  // And show it big on screen
  document.querySelectorAll('.bingo-splash').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'bingo-splash'; el.textContent = 'BINGOOO!';
  el.setAttribute('aria-hidden', 'true');
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}
$('#bingo-btn').onclick = () => {
  if (game.mode === 'youtube') ytPause();
  shoutBingo();
  $('#check-input').focus();
  $('#check-input').select();
};

// Manual mode
function manPlayNext() {
  const R = curR();
  if (R.next == null) return;
  R.played.push(R.next); R.current = R.next;
  R.next = pickNext(R, curSongs().length);
  save(); renderPlay();
}
function manReroll() {
  const R = curR();
  const n = pickNext(R, curSongs().length, [R.next]);
  if (n == null) { toast('That\'s the only song left.'); return; }
  R.next = n; save(); renderPlay();
}
function manToggle(i, cb) {
  const R = curR();
  if (R.played.includes(i)) {
    if (!confirm('Untick "' + curSongs()[i].label + '"? Only do this if it was ticked by mistake.')) { cb.checked = true; return; }
    R.played = R.played.filter(x => x !== i);
    R.current = R.played.length ? R.played[R.played.length - 1] : null;
  } else {
    R.played.push(i); R.current = i;
    if (R.next === i) R.next = pickNext(R, curSongs().length);
  }
  save(); renderPlay();
}

// ---------- YouTube ----------
let player = null, ytReady = false, ytPlaying = false, loadedIdx = null, testPlayer = null, testCb = null;
// curStart: where the loaded song's clip starts (seconds). midSeek: waiting to jump to the middle ('| mid').
let curStart = 0, midSeek = false;
function loadSong(s) {
  midSeek = s.start === 'mid';
  curStart = midSeek ? 0 : (s.start || 0);
  player.setVolume(midSeek ? 0 : 100);  // stay silent until we've jumped to the middle
  player.loadVideoById({videoId: s.id, startSeconds: curStart});
}
function doMidSeek() {
  if (!midSeek) return true;
  const d = player.getDuration();
  if (!(d > 0)) return false;
  midSeek = false;
  curStart = Math.floor(d / 2);
  player.seekTo(curStart, true);
  player.setVolume(100);
  return false;
}
const YT_ERRORS = {
  2: 'the link is broken', 5: 'the browser can\'t play it', 100: 'the video was removed or is private',
  101: 'the owner doesn\'t allow it to play on other sites', 150: 'the owner doesn\'t allow it to play on other sites',
  153: 'the page must be opened through the launcher (localhost), not as a file'
};
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', {
    width: 320, height: 180,
    playerVars: {playsinline: 1, rel: 0, modestbranding: 1},
    events: {
      onReady: () => { ytReady = true; renderPlay(); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) doMidSeek();
        if (e.data === YT.PlayerState.ENDED && ytPlaying) ytNext();
        else if (e.data === YT.PlayerState.PLAYING && !ytPlaying) { ytPlaying = true; renderPlay(); }
        else if (e.data === YT.PlayerState.PAUSED && ytPlaying) { ytPlaying = false; renderPlay(); }
      },
      onError: e => onYTError(e.data)
    }
  });
  testPlayer = new YT.Player('yttest-inner', {
    width: 200, height: 200, playerVars: {mute: 1, playsinline: 1},
    events: {
      onStateChange: e => { if (e.data === YT.PlayerState.PLAYING && testCb) { testCb('ok'); e.target.pauseVideo(); } },
      onError: e => testCb && testCb(e.data)
    }
  });
};
(function loadYTApi() {
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => toast('Couldn\'t reach YouTube. Check the internet connection.', 'bad');
  document.head.appendChild(s);
})();

function ytNext() {
  const R = curR(), songs = curSongs();
  if (!ytReady || R.pending || R.done) return;
  let i = pickNext(R, songs.length);
  while (i != null && !songs[i].id) { R.skipped.push(i); i = pickNext(R, songs.length); }
  if (i == null) { stopYT(); save(); renderPlay(); toast('Every song in this round has been played.'); return; }
  R.played.push(i); R.current = i; save();
  loadedIdx = i; ytPlaying = true;
  loadSong(songs[i]);
  renderPlay();
}
function ytPlay() {
  const R = curR();
  if (!ytReady || R.pending || R.done) return;
  if (R.current == null) return ytNext();
  ytPlaying = true;
  if (loadedIdx !== R.current) {
    const s = curSongs()[R.current];
    loadedIdx = R.current;
    loadSong(s);
  } else player.playVideo();
  renderPlay();
}
function ytPause() {
  ytPlaying = false;
  if (player && ytReady) player.pauseVideo();
  renderPlay();
}
function stopYT() {
  ytPlaying = false; loadedIdx = null;
  if (player && ytReady) player.stopVideo();
  $('#clipbar').style.width = '0';
  $('#cliptime').textContent = '';
}
function onYTError(code) {
  const R = curR(), songs = curSongs(), i = R.current;
  if (i == null) return;
  R.played = R.played.filter(x => x !== i);
  R.skipped.push(i);
  R.current = R.played.length ? R.played[R.played.length - 1] : null;
  loadedIdx = null; save();
  toast(`Skipped "${songs[i].label}": ${YT_ERRORS[code] || 'YouTube error ' + code}. Swap its link in Setup.`, 'bad');
  if (ytPlaying && code !== 153) ytNext(); else { ytPlaying = false; renderPlay(); }
}
// Clip timer: cuts each song after the clip length, with a short fade-out.
setInterval(() => {
  if (!ytReady || !player || game.mode !== 'youtube') return;
  const R = curR();
  if (!ytPlaying || R.current == null || loadedIdx !== R.current) return;
  if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
  if (!doMidSeek()) return;
  const el = Math.max(0, player.getCurrentTime() - curStart);
  const total = game.clip || Math.max(1, player.getDuration() - curStart);
  $('#clipbar').style.width = Math.min(100, el / total * 100) + '%';
  $('#cliptime').textContent = `${Math.floor(el)}s / ${Math.round(total)}s`;
  if (game.clip) {
    const left = game.clip - el;
    if (left < 2) player.setVolume(Math.max(0, left / 2 * 100));
    if (left <= 0) ytNext();
  }
}, 250);

async function testLinks(r) {
  const out = $('#s-testout');
  if (!ytReady || !testPlayer) { out.innerHTML = '<div class="note warn">The YouTube player is still loading. Try again in a moment.</div>'; return; }
  if (location.protocol === 'file:') { out.innerHTML = '<div class="note bad">Open the app with the launcher first (localhost). YouTube won\'t play from a file.</div>'; return; }
  const songs = songsOf(r).filter(s => s.id);
  if (!songs.length) { out.innerHTML = '<div class="note warn">No YouTube links in this round yet.</div>'; return; }
  $('#s-test').disabled = true;
  const bad = [];
  out.innerHTML = `<div class="note">Testing <span id="t-n">0</span> of ${songs.length}…</div><div class="testlist" id="t-list"></div>`;
  for (let k = 0; k < songs.length; k++) {
    const s = songs[k];
    const res = await new Promise(resolve => {
      let done = false;
      const t = setTimeout(() => fin('timeout'), 12000);
      function fin(v) { if (done) return; done = true; clearTimeout(t); testCb = null; resolve(v); }
      testCb = fin;
      testPlayer.mute();
      testPlayer.loadVideoById({videoId: s.id});
    });
    if ($('#t-n')) $('#t-n').textContent = k + 1;
    if (res !== 'ok') {
      bad.push(s);
      const why = res === 'timeout' ? 'didn\'t start (slow internet or blocked)' : (YT_ERRORS[res] || 'error ' + res);
      if ($('#t-list')) $('#t-list').insertAdjacentHTML('beforeend', `<div>❌ Line ${s.line}: ${esc(s.label)}: ${esc(why)}</div>`);
    }
  }
  testPlayer.stopVideo();
  $('#s-test').disabled = false;
  out.querySelector('.note').className = 'note ' + (bad.length ? 'bad' : 'ok');
  out.querySelector('.note').textContent = bad.length
    ? `${songs.length - bad.length} of ${songs.length} links work. Replace the ones below (try a "lyrics" or "official audio" upload of the same song).`
    : `✓ All ${songs.length} links play fine.`;
}

// ---------- Checking a claim ----------
$('#check-form').onsubmit = e => {
  e.preventDefault();
  const raw = $('#check-input').value;
  if (!raw.trim()) return;
  const pc = parseCode(raw);
  const r = curRoundIdx(), R = curR(), songs = curSongs();
  if (pc.error) lastCheck = {error: pc.error};
  else if (songs.length < 15) lastCheck = {error: 'This round needs at least 15 songs.'};
  else {
    const card = cardFor(pc.code, songs.length, r);
    const played = new Set(R.played);
    const marks = card.map(i => played.has(i));
    const rows = [0, 1, 2].map(k => marks.slice(k * 5, k * 5 + 5).filter(Boolean).length);
    const count = marks.filter(Boolean).length;
    const full = rows.filter(n => n === 5).length;
    const stage = R.done ? 3 : R.stage;
    const ok = [count >= 5, full >= 1, full >= 2, count === 15][stage];
    let msg;
    if (ok) msg = `✅ Valid! ${STAGES[stage].name}`;
    else if (stage === 0) msg = `❌ Not yet. Only ${count} of 5 songs have played.`;
    else if (stage === 1) msg = `❌ No full line yet. Best line has ${Math.max(...rows)} of 5.`;
    else if (stage === 2) msg = `❌ ${full} full line${full === 1 ? '' : 's'}, needs 2.`;
    else msg = `❌ ${count} of 15. ${15 - count} still to play.`;
    lastCheck = {
      code: pc.code, card, marks, rows, ok, msg, stage, current: R.current,
      issued: game.codes.includes(pc.code),
      already: R.winners.some(w => w.code === pc.code && w.stage === stage)
    };
  }
  renderCheckResult();
};
function renderCheckResult() {
  const box = $('#check-result');
  const c = lastCheck;
  if (!c) { box.innerHTML = ''; return; }
  if (c.error) { box.innerHTML = `<div class="verdict no">${esc(c.error)}</div>`; return; }
  const songs = curSongs(), R = curR();
  const canConfirm = c.ok && !c.already && c.stage === (R.done ? 3 : R.stage);
  box.innerHTML = `
    <div class="cgrid">${c.card.map((i, k) => `<div class="cell ${c.marks[k] ? 'hit' : ''} ${c.rows[Math.floor(k / 5)] === 5 ? 'rowfull' : ''} ${i === c.current ? 'last' : ''}">${esc(songs[i].title)}${songs[i].artist ? `<small>${esc(songs[i].artist)}</small>` : ''}</div>`).join('')}</div>
    <div class="small muted" style="margin-top:6px">Round ${curRoundIdx() + 1} card for ${c.code} · green = played${c.current != null && c.card.includes(c.current) ? ' · yellow outline = the song playing now' : ''}</div>
    <div class="verdict ${c.ok ? 'ok' : 'no'}">${esc(c.msg)}</div>
    ${!c.issued ? '<div class="note warn" style="margin-top:8px">Heads up: this code isn\'t one from your latest print. It could be an old printout.</div>' : ''}
    ${c.already ? '<div class="note ok" style="margin-top:8px">Already confirmed as a winner for this.</div>' : ''}
    <div class="row" style="margin-top:12px">
      ${canConfirm ? `<button class="btn good big" id="confirm-btn">🏆 Confirm winner</button>` : ''}
      ${!c.ok && game.mode === 'youtube' && !R.pending && !R.done ? `<button class="btn big" id="resume-btn">▶ Not a win, keep playing</button>` : ''}
      <button class="btn ghost" id="clear-check">Clear</button>
    </div>`;
  if ($('#confirm-btn')) $('#confirm-btn').onclick = () => {
    R.winners.push({code: c.code, stage: c.stage, songs: R.played.length});
    R.pending = true;
    if (c.stage === 3) R.done = true;
    c.already = true; save();
    if (game.mode === 'youtube') ytPause();
    renderPlay(); renderCheckResult();
    $('#check-input').value = '';
  };
  if ($('#resume-btn')) $('#resume-btn').onclick = () => { lastCheck = null; $('#check-input').value = ''; renderCheckResult(); ytPlay(); };
  $('#clear-check').onclick = () => { lastCheck = null; $('#check-input').value = ''; renderCheckResult(); };
}

// ---------- Start ----------
setView(songsOf(0).length >= 15 && game.codes.length ? 'play' : 'setup');
</script>
